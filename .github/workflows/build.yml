name: Build Online Cinema
on:
  push:
    branches: [main, feature/mvp-catalog-streaming, test/channel-playback-0.1.26]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.OnlineCinema/Jellyfin.Plugin.OnlineCinema.csproj
      - name: Compile
        run: dotnet build Jellyfin.Plugin.OnlineCinema/Jellyfin.Plugin.OnlineCinema.csproj --no-restore -c Release
      - name: Validate web client JavaScript
        run: node --check Jellyfin.Plugin.OnlineCinema/Web/client.js
      - name: Verify channel playback test wiring
        run: |
          grep -Fq "apiPost('ChannelTest/select', data)" Jellyfin.Plugin.OnlineCinema/Web/client.js
          grep -Fq "createAndPlayChannel(nativeId, session" Jellyfin.Plugin.OnlineCinema/Web/client.js
          if grep -Fq "apiPost('Strm/create'" Jellyfin.Plugin.OnlineCinema/Web/client.js; then
            echo "Client still creates STRM"; exit 1
          fi
          grep -Fq "IChannel, IHasCacheKey" Jellyfin.Plugin.OnlineCinema/Channels/ChannelPlaybackTestChannel.cs
          grep -Fq "SupportsDirectPlay = false" Jellyfin.Plugin.OnlineCinema/Channels/ChannelPlaybackTestChannel.cs
          grep -Fq "SupportsTranscoding = true" Jellyfin.Plugin.OnlineCinema/Channels/ChannelPlaybackTestChannel.cs
          grep -Fq "GetMediaInfo(" Jellyfin.Plugin.OnlineCinema/Api/ChannelTestController.cs
          grep -Fq "resolved.Count != 1" Jellyfin.Plugin.OnlineCinema/Api/ChannelTestController.cs
          grep -Fq "Recent.Select(entry" Jellyfin.Plugin.OnlineCinema/Channels/ChannelPlaybackTestChannel.cs
          # Jellyfin caches channel listings on disk across Jellyfin restarts.
          # A per-process token must accompany the incrementing DataVersion.
          grep -Fq "_startupCacheKey = Guid.NewGuid().ToString" Jellyfin.Plugin.OnlineCinema/Channels/ChannelPlaybackTestChannel.cs
          grep -Fq "_startupCacheKey + \"-\"" Jellyfin.Plugin.OnlineCinema/Channels/ChannelPlaybackTestChannel.cs
          grep -Fq "playbackErrorDialog()" Jellyfin.Plugin.OnlineCinema/Web/client.js
          grep -Fq "failedTorrents" Jellyfin.Plugin.OnlineCinema/Web/client.js
          grep -Fq "searchReleases(true)" Jellyfin.Plugin.OnlineCinema/Web/client.js
          if grep -Eq 'OcStrm|OcKeepStrm|OcPlaybackBackend|OcStreamDelivery|OcCheckStrmPaths|OcAutoMode' Jellyfin.Plugin.OnlineCinema/Configuration/configPage.html; then
            echo "Obsolete STRM or manual Play settings still exposed"; exit 1
          fi
          python3 - <<'PY'
          import pathlib
          html = pathlib.Path("Jellyfin.Plugin.OnlineCinema/Configuration/configPage.html").read_text()
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          pathlib.Path("/tmp/onlinecinema-config.js").write_text(script)
          PY
          node --check /tmp/onlinecinema-config.js
          if grep -Fq "IRequiresMediaInfoCallback" Jellyfin.Plugin.OnlineCinema/Channels/ChannelPlaybackTestChannel.cs; then
            echo "Duplicate dynamic media source still present"; exit 1
          fi
      - name: Prepare plugin files
        run: |
          mkdir -p pkg
          cp Jellyfin.Plugin.OnlineCinema/bin/Release/net10.0/Jellyfin.Plugin.OnlineCinema.dll pkg/
          python3 - <<'PY'
          import json, pathlib
          metadata = {
            "guid":"e1c3807b-47d2-4dd8-a40d-e5e57990a621",
            "name":"Online Cinema",
            "version":"0.1.29.0",
            "targetAbi":"12.2.0.0",
            "status":"Active",
            "autoUpdate":False
          }
          pathlib.Path("pkg/meta.json").write_text(json.dumps(metadata,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: onlinecinema-0.1.29-unique-channel-cache
          path: pkg/
