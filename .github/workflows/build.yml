name: Build Online Cinema
on:
  push:
    branches: [main, feature/mvp-catalog-streaming]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.OnlineCinema/Jellyfin.Plugin.OnlineCinema.csproj
      - name: Compile
        run: dotnet build Jellyfin.Plugin.OnlineCinema/Jellyfin.Plugin.OnlineCinema.csproj --no-restore -c Release
      - name: Validate web client JavaScript
        run: node --check Jellyfin.Plugin.OnlineCinema/Web/client.js
      - name: Verify STRM-only client and server routes
        run: |
          grep -Fq "apiPost('Strm/create'" Jellyfin.Plugin.OnlineCinema/Web/client.js
          if grep -Fq "fetch(client.getUrl('OnlineCinema/Strm/create')" Jellyfin.Plugin.OnlineCinema/Web/client.js; then
            echo "STRM creation must use Jellyfin ApiClient authentication, not raw fetch"
            exit 1
          fi
          grep -Fq "return await apiPost('Strm/create', data)" Jellyfin.Plugin.OnlineCinema/Web/client.js
          grep -Fq "RegisterImmediately(metadata, fullPath" Jellyfin.Plugin.OnlineCinema/Services/StrmLibraryService.cs
          grep -Fq "IsShortcut = true" Jellyfin.Plugin.OnlineCinema/Services/StrmLibraryService.cs
          grep -Fq "stream/" Jellyfin.Plugin.OnlineCinema/Services/TorrServerService.cs

          grep -Fq "createAndPlayStrm(nativeId, session" Jellyfin.Plugin.OnlineCinema/Web/client.js
          if grep -Fq "TorrServer/select" Jellyfin.Plugin.OnlineCinema/Web/client.js; then
            echo "Virtual playback still referenced by web client"
            exit 1
          fi
          grep -Fq "Conflict(new" Jellyfin.Plugin.OnlineCinema/Api/TorrServerController.cs
          grep -Fq "client.js?v=0.1.25" Jellyfin.Plugin.OnlineCinema/Web/ClientWebPatch.cs
      - name: Prepare plugin files
        run: |
          mkdir -p pkg
          cp Jellyfin.Plugin.OnlineCinema/bin/Release/net10.0/Jellyfin.Plugin.OnlineCinema.dll pkg/
          python3 - <<'PY'
          import json, pathlib
          metadata = {
            "guid":"e1c3807b-47d2-4dd8-a40d-e5e57990a621",
            "name":"Online Cinema",
            "version":"0.1.25.0",
            "targetAbi":"12.2.0.0",
            "status":"Active",
            "autoUpdate":False
          }
          pathlib.Path("pkg/meta.json").write_text(json.dumps(metadata,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: onlinecinema-0.1.25-instant-native
          path: pkg/
